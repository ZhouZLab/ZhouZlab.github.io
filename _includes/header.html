<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="{{ site.description }}">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    {% if page.group == 'news' %}
    <link rel="alternate" type="application/atom+xml" title="ZhouLab News Feed" href="/news.xml">
    {% endif %}
    <meta name="google-site-verification" content="j7wOwZ6gQ3BTNiPG9vmSBsDFwgr7DxRWMO728G6sdPE" />
    <!-- <link href="/static/css/bootstrap.css" rel="stylesheet"> -->
    <!-- <link href="/static/css/bootstrap-responsive.css" rel="stylesheet"> -->
    <link href="/static/css/syntax.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">

    <script type="text/javascript" src="https://www.google.com/jsapi"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
    <!-- HTML5 shim, for IE6-8 support of HTML5 elements -->
    <!--[if lt IE 9]>
      <script src="http://html5shim.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

<style>
/* Mobile-responsive navbar fixes */
@media (max-width: 767px) {
    .navbar-brand {
        white-space: normal;
        word-break: break-word;
        padding: 0.5rem 0.5rem;
        font-size: 0.9rem;
    }
    .navbar-brand img {
        height: 25px !important;
        margin-right: 5px;
    }
}
@media (max-width: 767px) {
    /* Target the logo image directly */
    .navbar .d-flex a:first-child img {
        height: 35px !important;
    }
}
  /* TEMPORARY NAVBAR FIX */
  .navbar-brand {
      white-space: nowrap !important;
      font-size: 1rem !important;
      min-width: 180px !important;
  }
  @media (max-width: 767px) {
      .navbar-brand {
          font-size: 0.9rem !important;
          overflow: hidden;
          text-overflow: ellipsis;
      }
  }

</style>

    
  </head>

  <body>

                    <!-- Static navbar -->
    <nav class="navbar navbar-expand-md navbar-dark" style="background-color: #000000">
      <div class="d-flex align-items-center" style="margin-left: 20px;">
        <a href="/" style="padding: 0; display: flex; align-items: center; text-decoration: none;">
            <img src="/static/img/zhoulogo9.png" style="height: 50px; display: block;">
            <span style='font-size: 1.3rem; color: white; margin-left: 8px;'>Zhou Lab</span>
        </a>
      </div>
        <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="navbar-collapse collapse" id="navbarContent">
          <ul class="navbar-nav ml-auto">
            {% for link in site.data.navlinks %}
              {% if page.group == link.group %}
                <li class = "nav-item active"><a class="nav-link" href="{{link.link}}" alt="{{link.name}}"> {{link.name}}<span class="sr-only">(current)</span></a></li>
              {% else %}
                <li class="nav-item"><a class="nav-link" href="{{link.link}}" alt="{{link.name}}"> {{link.name}}</a></li>
              {% endif %}
            {% endfor %}
          </ul>
        </div><!--/.nav-collapse -->
    </nav>

    <div class="container">
